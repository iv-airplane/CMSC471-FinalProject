<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Wake Up — Trip heatmap</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div id="app">
    <h1 id="title">City Wake Up: Total Trips by Hour and Day of Week</h1>
    <p class="sub" id="subtitle"></p>
    <div class="controls">
      <label for="taxi-type">Taxi type</label>
      <select id="taxi-type" aria-label="Taxi type"></select>
    </div>
    <div id="chart-wrap"></div>
  </div>
  <div id="tooltip" role="status" aria-live="polite"></div>

  <script src="js/script.js"></script>
</body>
</html>
